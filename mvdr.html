<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adaptive Signal Processing – MVDR</title>
  <link rel="stylesheet" href="mvdr.css">
</head>
<body>

  <!-- TITLE -->
  <h2 class="title">
    <a href="#">Adaptive Signal Processing</a>
  </h2>

  <!-- TABS -->
<div class="tab-container">
  <button class="tab-btn" onclick="goLMS()">LMS</button>
  <button class="tab-btn active" onclick="goMVDR()">MVDR</button>
</div>


  <!-- MAIN CONTENT -->
  <div class="simulation-wrapper">
    <div class="main-box">

      <!-- CODE SECTION -->
      <div class="code-section">
        <textarea id="codeBox" readonly>
Code will be generated here..!
        </textarea>

        <div class="code-buttons">
          <button class="btn small" onclick="downloadCode()">Download</button>
          <button class="btn small" onclick="submitAndRun()">Submit & Run</button>
        </div>
      </div>

      <!-- PARAMETERS -->
      <div class="param-section">
        <h3>Select the input Parameters</h3>

        <div class="param">
          <label>8 ≤ Number of antennas (N) ≤ 12</label>
          <div class="input-row">
            <input type="text" id="N_val" value="10">
            <input type="range" id="N" min="8" max="12" value="10">
          </div>
        </div>

        <div class="param">
          <label>0 ≤ DOA of signal (θₛ) ≤ 90</label>
          <div class="input-row">
            <input type="text" id="theta_s_val" value="45">
            <input type="range" id="theta_s" min="0" max="90" value="45">
          </div>
        </div>

        <div class="param">
          <label>-90 ≤ DOA of interference (θᵢ) ≤ 0</label>
          <div class="input-row">
            <input type="text" id="theta_i_val" value="-45">
            <input type="range" id="theta_i" min="-90" max="0" value="-45">
          </div>
        </div>

        <div class="param">
          <label>1024 ≤ Number of snapshots (ss) ≤ 8192</label>
          <div class="input-row">
            <input type="text" id="ss_val" value="4096">
            <input type="range" id="ss" min="1024" max="8192" step="1" value="4096">
          </div>
        </div>

        <div class="param">
          <label>0 ≤ SNR (dB) ≤ 40</label>
          <div class="input-row">
            <input type="text" id="snr_val" value="20">
            <input type="range" id="snr" min="0" max="40" value="20">
          </div>
        </div>

        <div class="param">
          <label>10 ≤ INR (dB) ≤ 40</label>
          <div class="input-row">
            <input type="text" id="inr_val" value="25">
            <input type="range" id="inr" min="10" max="40" value="25">
          </div>
        </div>

        <div class="param">
          <label>10 ≤ Monte Carlo runs ≤ 100</label>
          <div class="input-row">
            <input type="text" id="runs_val" value="50">
            <input type="range" id="runs" min="10" max="100" value="50">
          </div>
        </div>

        <button class="btn large" onclick="generateCode()">Generate Code</button>
      </div>

    </div>
  </div>
<div class="graph-wrapper">
  <canvas id="mvdrChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="mvdr.js"></script>

</body>
</html>
